<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Markdown 笔记</title>
<style>
  :root {
    --bg: #0a0a0a;
    --panel: rgba(255,255,255,.04);
    --panel-2: rgba(255,255,255,.07);
    --border: rgba(255,255,255,.1);
    --text: #f5f5f7;
    --muted: #9aa0aa;
    --accent: #6366f1;
    --accent-2: #22d3ee;
    --grad: linear-gradient(135deg,#6366f1,#22d3ee);
    --font: -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    --mono: "SF Mono", ui-monospace, Consolas, "Cascadia Code", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--font); background: var(--bg); color: var(--text);
    overflow: hidden; -webkit-font-smoothing: antialiased;
  }
  .app { display: flex; height: 100vh; height: 100dvh; }

  /* ---------- 侧边栏 ---------- */
  .sidebar {
    width: 272px; flex: none; display: flex; flex-direction: column;
    border-right: 1px solid var(--border); background: rgba(255,255,255,.02);
  }
  .sidebar__head { padding: 18px 16px 12px; display: flex; gap: 10px; align-items: center; }
  .sidebar__title { font-size: 1rem; font-weight: 700; flex: 1; }
  .btn-icon {
    width: 32px; height: 32px; border-radius: 9px; cursor: pointer; font-size: .95rem;
    background: var(--grad); border: none; color: #06111a; font-weight: 700;
    transition: filter .2s ease, transform .2s ease;
  }
  .btn-icon:hover { filter: brightness(1.1); transform: translateY(-1px); }
  .search-wrap { padding: 0 16px 12px; }
  .search-wrap input {
    width: 100%; font: inherit; font-size: .84rem; color: var(--text);
    background: rgba(255,255,255,.05); border: 1px solid var(--border);
    border-radius: 9px; padding: 8px 12px; outline: none;
  }
  .search-wrap input:focus { border-color: var(--accent); }
  .note-list { flex: 1; overflow-y: auto; padding: 0 10px 10px; }
  .note-item {
    padding: 11px 12px; border-radius: 10px; cursor: pointer; margin-bottom: 4px;
    border: 1px solid transparent; transition: all .18s ease;
  }
  .note-item:hover { background: var(--panel); }
  .note-item.is-active { background: var(--panel-2); border-color: rgba(99,102,241,.5); }
  .note-item__title {
    font-size: .86rem; font-weight: 600; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .note-item__meta { font-size: .7rem; color: var(--muted); margin-top: 2px; }
  .note-item__del {
    float: right; opacity: 0; border: none; background: transparent; cursor: pointer;
    color: var(--muted); font-size: .8rem; transition: opacity .15s ease, color .15s ease;
  }
  .note-item:hover .note-item__del { opacity: 1; }
  .note-item__del:hover { color: #f87171; }

  /* ---------- 编辑区 / 预览区 ---------- */
  .editor-pane, .preview-pane {
    flex: 1; min-width: 0; display: flex; flex-direction: column;
  }
  .editor-pane { border-right: 1px solid var(--border); }
  .pane-head {
    display: flex; align-items: center; gap: 10px; padding: 14px 20px;
    border-bottom: 1px solid var(--border); min-height: 56px;
  }
  .pane-head span { font-size: .78rem; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
  .title-input {
    font: inherit; font-size: 1rem; font-weight: 700; color: var(--text);
    background: transparent; border: none; outline: none; width: 100%;
  }
  .status { margin-left: auto; font-size: .72rem; color: var(--muted); white-space: nowrap; }
  .status.is-saved { color: #34d399; }
  textarea {
    flex: 1; width: 100%; resize: none; outline: none; border: none;
    background: transparent; color: var(--text); font-family: var(--mono);
    font-size: .88rem; line-height: 1.75; padding: 20px; tab-size: 2;
  }
  .preview {
    flex: 1; overflow-y: auto; padding: 20px 26px 60px; line-height: 1.75; font-size: .92rem;
  }

  /* ---------- Markdown 预览样式 ---------- */
  .preview h1, .preview h2, .preview h3 { margin: 1.2em 0 .5em; line-height: 1.3; }
  .preview h1 { font-size: 1.7rem; border-bottom: 1px solid var(--border); padding-bottom: .3em; }
  .preview h2 { font-size: 1.35rem; }
  .preview h3 { font-size: 1.12rem; }
  .preview p { margin: .6em 0; color: #d7dae1; }
  .preview a { color: var(--accent-2); text-decoration: none; border-bottom: 1px solid rgba(34,211,238,.35); }
  .preview strong { color: #fff; }
  .preview em { color: #c4b5fd; }
  .preview ul, .preview ol { margin: .6em 0 .6em 1.4em; color: #d7dae1; }
  .preview li { margin: .25em 0; }
  .preview blockquote {
    margin: .8em 0; padding: .5em 1em; border-left: 3px solid var(--accent);
    background: rgba(99,102,241,.08); border-radius: 0 8px 8px 0; color: var(--muted);
  }
  .preview code.inline {
    font-family: var(--mono); font-size: .84em; padding: .15em .45em; border-radius: 6px;
    background: rgba(255,255,255,.08); color: #fca5a5;
  }
  .preview pre {
    margin: .9em 0; padding: 14px 16px; border-radius: 12px; overflow-x: auto;
    background: #101014; border: 1px solid var(--border);
  }
  .preview pre code { font-family: var(--mono); font-size: .84rem; line-height: 1.65; }
  .preview hr { border: none; border-top: 1px solid var(--border); margin: 1.4em 0; }
  .preview table { border-collapse: collapse; margin: .8em 0; width: 100%; }
  .preview th, .preview td { border: 1px solid var(--border); padding: 7px 12px; font-size: .85rem; }
  .preview th { background: rgba(255,255,255,.05); }
  .preview .lang-tag {
    display: block; font-size: .68rem; color: var(--muted); margin-bottom: 8px;
    letter-spacing: .1em; text-transform: uppercase;
  }
  /* 代码高亮 */
  .tok-key { color: #c792ea; }
  .tok-str { color: #c3e88d; }
  .tok-num { color: #f78c6c; }
  .tok-com { color: #6b7280; font-style: italic; }
  .tok-fn  { color: #82aaff; }

  .empty-preview { color: var(--muted); font-size: .9rem; text-align: center; padding-top: 60px; }

  /* ---------- 响应式 ---------- */
  @media (max-width: 1080px) {
    .sidebar { width: 220px; }
  }
  @media (max-width: 860px) {
    .app { flex-direction: column; }
    .sidebar {
      width: 100%; height: 180px; border-right: none;
      border-bottom: 1px solid var(--border);
    }
    .editor-pane { border-right: none; border-bottom: 1px solid var(--border); min-height: 42vh; }
    .preview-pane { min-height: 42vh; }
  }
</style>
</head>
<body>
<div class="app">
  <!-- 侧边栏 -->
  <aside class="sidebar">
    <div class="sidebar__head">
      <span class="sidebar__title">📝 我的笔记</span>
      <button class="btn-icon" id="newNote" title="新建笔记" aria-label="新建笔记">＋</button>
    </div>
    <div class="search-wrap">
      <input id="searchNotes" type="search" placeholder="搜索笔记标题…" />
    </div>
    <div class="note-list" id="noteList"></div>
  </aside>

  <!-- 编辑区 -->
  <section class="editor-pane">
    <div class="pane-head">
      <input class="title-input" id="titleInput" placeholder="笔记标题…" maxlength="60" />
      <span class="status" id="saveStatus">已保存</span>
    </div>
    <textarea id="editor" spellcheck="false" placeholder="在这里写 Markdown…
# 支持标题
**粗体** *斜体* `行内代码`
> 引用
- 列表
```js
// 代码块
```
"></textarea>
  </section>

  <!-- 预览区 -->
  <section class="preview-pane">
    <div class="pane-head"><span>实时预览</span></div>
    <div class="preview" id="preview"></div>
  </section>
</div>

<script>
/* ============================================================
   轻量 Markdown 解析器（零依赖）
   ============================================================ */
const escapeHtml = (s) =>
  s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

/** 关键字集合（JS + Python 常用） */
const KEYWORDS = new Set([
  "const", "let", "var", "function", "return", "if", "else", "for", "while",
  "class", "new", "import", "from", "export", "default", "def", "elif", "async",
  "await", "try", "except", "catch", "finally", "switch", "case", "break",
  "continue", "True", "False", "None", "null", "undefined", "true", "false",
  "in", "not", "and", "or", "is", "this", "self", "yield", "lambda", "print",
]);

/**
 * 简单语法高亮：用 tokenizer 逐段扫描，每段单独转义后再包 span，
 * 避免「插入的 HTML 标签被后续正则二次处理」的经典 bug。
 */
function highlight(code) {
  // 依次匹配：注释 | 字符串 | 数字 | 标识符
  const re = /(\/\/[^\n]*|#[^\n]*|--[^\n]*)("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|`(?:\\.|[^`\\])*`)|\b(\d+(?:\.\d+)?)\b|([A-Za-z_$][\w$]*)/g;

  const out = [];
  let lastIndex = 0;
  let m;

  while ((m = re.exec(code)) !== null) {
    // 词法单元之间的普通文本
    if (m.index > lastIndex) {
      out.push(escapeHtml(code.slice(lastIndex, m.index)));
    }

    if (m[1]) {
      out.push(`<span class="tok-com">${escapeHtml(m[1])}</span>`);
    } else if (m[2]) {
      out.push(`<span class="tok-str">${escapeHtml(m[2])}</span>`);
    } else if (m[3]) {
      out.push(`<span class="tok-num">${escapeHtml(m[3])}</span>`);
    } else if (m[4]) {
      const word = m[4];
      out.push(
        KEYWORDS.has(word)
          ? `<span class="tok-key">${escapeHtml(word)}</span>`
          : escapeHtml(word)
      );
    }

    lastIndex = re.lastIndex;

    // 防止零宽匹配死循环
    if (re.lastIndex === m.index) re.lastIndex++;
  }

  if (lastIndex < code.length) {
    out.push(escapeHtml(code.slice(lastIndex)));
  }

  return out.join("");
}

/**
 * 解析 Markdown → HTML
 * 顺序：代码块 → 行内代码 → 标题 → 引用 → 列表 → 分割线 → 表格 → 段落 → 行内样式
 */
function parseMarkdown(md) {
  const codeBlocks = [];

  // 1) 先抽出围栏代码块，避免内部内容被后续规则破坏
  let text = md.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => {
    codeBlocks.push({ lang: lang || "code", code });
    return `\u0000CODEBLOCK${codeBlocks.length - 1}\u0000`;
  });

  // 2) 抽出行内代码
  const inlineCodes = [];
  text = text.replace(/`([^`\n]+)`/g, (_, code) => {
    inlineCodes.push(code);
    return `\u0000INLINECODE${inlineCodes.length - 1}\u0000`;
  });

  // 3) 转义剩余 HTML
  text = escapeHtml(text);

  const lines = text.split("\n");
  const html = [];
  let listType = null; // "ul" | "ol"
  let inBlockquote = false;

  const closeList = () => {
    if (listType) {
      html.push(`</${listType}>`);
      listType = null;
    }
  };
  const closeQuote = () => {
    if (inBlockquote) {
      html.push("</blockquote>");
      inBlockquote = false;
    }
  };

  lines.forEach((raw) => {
    const line = raw.trimEnd();

    // 空行
    if (line.trim() === "") {
      closeList();
      closeQuote();
      return;
    }

    // 代码块占位
    const codeMatch = line.match(/^\u0000CODEBLOCK(\d+)\u0000$/);
    if (codeMatch) {
      closeList();
      closeQuote();
      const { lang, code } = codeBlocks[Number(codeMatch[1])];
      html.push(
        `<pre><span class="lang-tag">${escapeHtml(lang)}</span><code>${highlight(code, lang)}</code></pre>`
      );
      return;
    }

    // 标题
    const h = line.match(/^(#{1,3})\s+(.*)$/);
    if (h) {
      closeList();
      closeQuote();
      const level = h[1].length;
      html.push(`<h${level}>${inlineFormat(h[2])}</h${level}>`);
      return;
    }

    // 分割线
    if (/^(-{3,}|\*{3,})$/.test(line.trim())) {
      closeList();
      closeQuote();
      html.push("<hr />");
      return;
    }

    // 引用
    const bq = line.match(/^>\s?(.*)$/);
    if (bq) {
      closeList();
      if (!inBlockquote) {
        html.push("<blockquote>");
        inBlockquote = true;
      }
      html.push(`<p>${inlineFormat(bq[1])}</p>`);
      return;
    }
    closeQuote();

    // 无序列表
    const ul = line.match(/^[-*+]\s+(.*)$/);
    if (ul) {
      if (listType !== "ul") {
        closeList();
        html.push("<ul>");
        listType = "ul";
      }
      html.push(`<li>${inlineFormat(ul[1])}</li>`);
      return;
    }

    // 有序列表
    const ol = line.match(/^\d+\.\s+(.*)$/);
    if (ol) {
      if (listType !== "ol") {
        closeList();
        html.push("<ol>");
        listType = "ol";
      }
      html.push(`<li>${inlineFormat(ol[1])}</li>`);
      return;
    }

    // 普通段落
    closeList();
    html.push(`<p>${inlineFormat(line)}</p>`);
  });

  closeList();
  closeQuote();

  let out = html.join("\n");

  // 4) 还原行内代码
  out = out.replace(/\u0000INLINECODE(\d+)\u0000/g, (_, i) => {
    return `<code class="inline">${escapeHtml(inlineCodes[Number(i)])}</code>`;
  });

  return out;
}

/** 行内格式：粗体、斜体、删除线、链接 */
function inlineFormat(str) {
  return str
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(?<!\*)\*([^*\n]+)\*(?!\*)/g, "<em>$1</em>")
    .replace(/~~([^~]+)~~/g, "<del>$1</del>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}

/* ============================================================
   笔记数据层（LocalStorage）
   ============================================================ */
const STORAGE_KEY = "vibe_notes_v1";

const Store = {
  load() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    } catch (e) {
      return [];
    }
  },
  save(notes) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
  },
};

let notes = Store.load();
let activeId = null;
let searchKeyword = "";

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

/* ============================================================
   UI 引用
   ============================================================ */
const listEl = document.getElementById("noteList");
const titleInput = document.getElementById("titleInput");
const editor = document.getElementById("editor");
const preview = document.getElementById("preview");
const statusEl = document.getElementById("saveStatus");

/* ============================================================
   渲染
   ============================================================ */
function renderList() {
  const kw = searchKeyword.trim().toLowerCase();
  const visible = notes
    .filter((n) => !kw || n.title.toLowerCase().includes(kw))
    .sort((a, b) => b.updatedAt - a.updatedAt);

  listEl.innerHTML = "";

  if (visible.length === 0) {
    listEl.innerHTML = '<p style="padding:16px 12px;color:#9aa0aa;font-size:.82rem;">暂无笔记，点右上角 ＋ 新建</p>';
    return;
  }

  visible.forEach((n) => {
    const item = document.createElement("div");
    item.className = "note-item" + (n.id === activeId ? " is-active" : "");
    item.innerHTML = `
      <button class="note-item__del" title="删除">🗑</button>
      <div class="note-item__title"></div>
      <div class="note-item__meta"></div>`;
    item.querySelector(".note-item__title").textContent = n.title || "无标题";
    item.querySelector(".note-item__meta").textContent = formatDate(n.updatedAt);

    item.addEventListener("click", () => selectNote(n.id));
    item.querySelector(".note-item__del").addEventListener("click", (e) => {
      e.stopPropagation();
      removeNote(n.id);
    });

    listEl.appendChild(item);
  });
}

function formatDate(ts) {
  const d = new Date(ts);
  const pad = (x) => String(x).padStart(2, "0");
  return `${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function renderPreview() {
  const md = editor.value;
  if (!md.trim()) {
    preview.innerHTML = '<p class="empty-preview">左侧输入 Markdown，这里实时预览 ✨</p>';
    return;
  }
  preview.innerHTML = parseMarkdown(md);
}

/* ============================================================
   操作
   ============================================================ */
function selectNote(id) {
  saveCurrent(); // 切换前先保存当前
  activeId = id;
  const n = notes.find((x) => x.id === id);
  if (!n) return;
  titleInput.value = n.title;
  editor.value = n.content;
  renderList();
  renderPreview();
  setStatus("已保存");
}

function createNote() {
  saveCurrent();
  const note = {
    id: uid(),
    title: "无标题笔记",
    content: "# 新笔记\n\n开始写点什么吧…\n",
    updatedAt: Date.now(),
  };
  notes.unshift(note);
  Store.save(notes);
  selectNote(note.id);
  titleInput.focus();
  titleInput.select();
}

function removeNote(id) {
  const idx = notes.findIndex((n) => n.id === id);
  if (idx === -1) return;
  if (!confirm(`确定删除笔记「${notes[idx].title || "无标题"}」吗？`)) return;

  notes.splice(idx, 1);
  Store.save(notes);

  if (activeId === id) {
    activeId = notes[0] ? notes[0].id : null;
    if (activeId) {
      const n = notes.find((x) => x.id === activeId);
      titleInput.value = n.title;
      editor.value = n.content;
      renderPreview();
    } else {
      titleInput.value = "";
      editor.value = "";
      renderPreview();
    }
  }
  renderList();
}

function saveCurrent() {
  if (!activeId) return;
  const n = notes.find((x) => x.id === activeId);
  if (!n) return;
  n.title = titleInput.value.trim() || "无标题笔记";
  n.content = editor.value;
  n.updatedAt = Date.now();
  Store.save(notes);
}

function setStatus(text) {
  statusEl.textContent = text;
  statusEl.classList.toggle("is-saved", text === "已保存");
}

/* ============================================================
   事件绑定
   ============================================================ */
let saveTimer = null;

function scheduleAutosave() {
  setStatus("编辑中…");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    saveCurrent();
    renderList();
    setStatus("已保存");
  }, 400);
}

editor.addEventListener("input", () => {
  renderPreview();
  scheduleAutosave();
});

titleInput.addEventListener("input", scheduleAutosave);

// Tab 键插入两个空格，而不是切换焦点
editor.addEventListener("keydown", (e) => {
  if (e.key === "Tab") {
    e.preventDefault();
    const start = editor.selectionStart;
    const end = editor.selectionEnd;
    editor.setRangeText("  ", start, end, "end");
    renderPreview();
    scheduleAutosave();
  }
  // Ctrl/Cmd + B 加粗
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "b") {
    e.preventDefault();
    wrapSelection("**");
  }
  // Ctrl/Cmd + I 斜体
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "i") {
    e.preventDefault();
    wrapSelection("*");
  }
});

function wrapSelection(marker) {
  const start = editor.selectionStart;
  const end = editor.selectionEnd;
  const selected = editor.value.slice(start, end) || "文字";
  editor.setRangeText(marker + selected + marker, start, end, "select");
  renderPreview();
  scheduleAutosave();
}

document.getElementById("newNote").addEventListener("click", createNote);
document.getElementById("searchNotes").addEventListener("input", (e) => {
  searchKeyword = e.target.value;
  renderList();
});

window.addEventListener("beforeunload", saveCurrent);

/* ============================================================
   初始化
   ============================================================ */
if (notes.length === 0) {
  notes = [
    {
      id: uid(),
      title: "欢迎使用 Markdown 笔记",
      content: `# 欢迎使用 Markdown 笔记 ✍️

这是一个支持**实时预览**的 Markdown 笔记应用。

## 支持语法
- **粗体**、*斜体*、~~删除线~~
- \`行内代码\`
- [链接](https://www.example.com)
- 无序 / 有序列表
- > 引用块
- 代码块语法高亮

## 代码示例
\`\`\`js
const greet = (name) => {
  // 打个招呼
  return "Hello, " + name;
};
console.log(greet("Vibe Coding"));
\`\`\`

\`\`\`python
def fib(n):
    """生成斐波那契数列"""
    a, b = 0, 1
    for _ in range(n):
        yield a
        a, b = b, a + b
\`\`\`

## 快捷键
- \`Ctrl/Cmd + B\` 加粗
- \`Ctrl/Cmd + I\` 斜体
- \`Tab\` 插入两个空格

> 笔记自动保存在浏览器本地，刷新不会丢失。
`,
      updatedAt: Date.now(),
    },
  ];
  Store.save(notes);
}

selectNote(notes[0].id);
</script>
</body>
</html>
